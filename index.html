<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parks de Luca</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f4;
            color: #333;
        }

        header {
            background: #2E7D32;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
        }

        header p {
            margin-top: 12px;
            font-size: 1.2rem;
            opacity: .9;
        }

        .container {
            width: min(1200px, 95%);
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid #ddd;
        }

        .card-header h2 {
            margin: 0;
        }

        iframe {
            width: 100%;
            height: 75vh;
            border: none;
        }

        .info {
            margin-top: 20px;
            background: #E8F5E9;
            border-left: 5px solid #2E7D32;
            padding: 20px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width:768px) {
            header h1 {
                font-size:2rem;
            }

            iframe {
                height:70vh;
            }

            .card-header {
                flex-direction:column;
                align-items:flex-start;
                gap:10px;
            }
        }
    </style>

</head>
<body>


<div class="container">

    <div class="card">

        <div class="card-header">
            <h2>Playgrounds</h2>
            <span>Click a marker for details</span>
        </div>

        <!--
            Replace YOUR_MAP_ID with your Google My Maps ID.

            Example:

            https://www.google.com/maps/d/embed?mid=1abcDEFgHiJKLmNoPQRstuVWxyz12345
        -->

        <iframe
            src="https://www.google.com/maps/d/u/0/embed?mid=1pkPPrq_GkluxP-d6_A61gPwkKflKccU&ehbc=2E312F"
            loading="lazy"
            allowfullscreen>
        </iframe
